hf_training_args:
  do_train: True
  do_eval: True

  num_train_epochs: 6
  # max_steps: 1500
  optim: "adamw_torch"
  learning_rate: 0.00002
  warmup_steps: 100

  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 16
  eval_accumulation_steps: 1

  dataloader_num_workers: 20
  dataloader_pin_memory: True
  dataloader_drop_last: False

  logging_steps: 1
  report_to: "wandb"
  remove_unused_columns: False # NEVER TOUCH THIS

  fp16: True

  metric_for_best_model: "laion/meteor"
  greater_is_better: True

  load_best_model_at_end: True
  predict_with_generate: True # NEVER TOUCH THIS
  generation_num_beams: 1
  generation_max_length: 200
  evaluation_strategy: "steps"
  eval_steps: 1000

  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 5


architecture:
  name: "openai/whisper-large-v3-turbo"
  use_pretrained_whisper_encoder: True
  use_pretrained_whisper_decoder: True

early_stopping:
  should_early_stop: False
  early_stopping_patience: null
  early_stopping_threshold: null

logging:
  log_preds_every_n_steps: 1000
  # these are per dataset
  log_preds_num_train: 8
  log_preds_num_valid: 32

dataset_mix:
  weights: 
    laion: 1.0
    clotho: 0.0
    audioset: 0.0
    audiocaps: 0.0
  limit_val_split:
    laion: null
    clotho: null
    audioset: null
    audiocaps: null

dataset_type: "mitermix" # "laion" or "mitermix"

dataset_columns:
  laion:
    column_audio: "audio.mp3"
    column_duration: "duration_ms"
    column_duration_scale: 1000.0
    column_metadata: "metadata.json"
    column_file_name: "segment_filename"
  mitermix:
    column_audio: "mp3"
    column_duration: "duration"
    column_duration_scale: 1.0
    column_metadata: "json"
    column_file_name: "sample_id"
